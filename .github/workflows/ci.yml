name: Validate Conan Action
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  testing-action:
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Execute checkout
        uses: actions/checkout@v7

      - name: Consume Conan Action
        uses: ./
        with:
          version: '2.29.1'
          config_urls: |
              https://github.com/conan-io/conan-extensions.git
              https://github.com/conan-io/conan-extensions.git
              https://github.com/conan-io/conan-extensions.git
          # This should always be set using a GitHub secret, never as a raw string in the action.
          # This is only for testing purposes.
          audit_token: 'fake_token'
          home: ${{ github.workspace }}/conan_home
          cache_packages: 'true'
          # DEPRECATED: Expected to see a warning about the python_version input being deprecated in the action logs
          python_version: '3.10'

      - name: Verify action results
        shell: bash
        run: |
          conan --version | grep -q '2.29.1'
          conan profile show -pr:a default | grep -q 'settings'
          grep -q token "$(conan config home)/audit_providers.json"
          conan config home | grep -q "conan_home"

      - name: Validate caching Conan packages
        shell: bash
        run: |
          conan install -r conancenter --requires=asio/1.32.0 --build=missing

  cache-restore-test:
    needs: testing-action
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Execute checkout
        uses: actions/checkout@v7

      - name: Consume Conan Action
        uses: ./
        with:
          version: '2.29.1'
          # Must be the same path used by testing-action, otherwise the cache is not restored
          home: ${{ github.workspace }}/conan_home
          cache_packages: 'true'

      - name: Verify cache was restored
        shell: bash
        run: |
          # asio is only in the local cache of this fresh runner if it was restored by prefix
          conan cache path asio/1.32.0

  cache-key-save:
    runs-on: ubuntu-latest
    steps:
      - name: Execute checkout
        uses: actions/checkout@v7

      - name: Consume Conan Action
        uses: ./
        with:
          cache_packages: 'true'
          cache_key: conan-ci-custom-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install package to be cached
        shell: bash
        run: |
          conan install -r conancenter --requires=nlohmann_json/3.11.3 --build=missing

  cache-key-restore:
    needs: cache-key-save
    runs-on: ubuntu-latest
    steps:
      - name: Execute checkout
        uses: actions/checkout@v7

      - name: Consume Conan Action
        uses: ./
        with:
          cache_packages: 'true'
          cache_key: conan-ci-custom-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify cache was restored from the custom key
        shell: bash
        run: |
          conan cache path nlohmann_json/3.11.3
          if conan cache path asio/1.32.0; then
            echo "asio should not be restored when using a custom cache_key because it was not saved under that key"
            exit 1
          fi

  docker-test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v7
      - name: Consume Conan Action
        uses: ./
        with:
          version: "2.29.1"
          use_venv: true
          cache_packages: 'false'
      - name: test conan is available
        run: |
          conan --version
          command -v conan | grep conan-venv

  profile-detect-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Consume Conan Action without profile detection
        uses: ./
        with:
          profile_detect: 'false'
      - name: Check for non existing default profile in Conan cache
        shell: bash
        run: if [ -e "$(conan config home)/profiles/default" ]; then echo "Default profile should not exist"; exit 1; fi
