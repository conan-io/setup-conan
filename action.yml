name: 'Setup Conan Client'
description: 'A GitHub Action to install and configure the Conan client'
author: 'Conan.io <conan@jfrog.com>'

inputs:
  version:
    description: 'Version of Conan 2.x to install'
    required: false
    default: ''
  config_urls:
    description: 'URLs or paths to a Conan configuration repository to be installed. Use new lines to separate multiple URLs.'
    required: false
    default: ''
  audit_token:
    description: 'Conan audit token to be used for authentication'
    required: false
    default: ''
  home:
    description: 'Custom path for Conan cache directory'
    required: false
    default: ''
  cache_packages:
    description: 'Cache all Conan packages from the cache'
    required: false
    default: 'false'
  cache_key:
    description: 'Custom segment for the Conan packages cache key. Requires cache_packages. It is added as an extra segment to the key computed from the runner OS, architecture and image, so each value gets its own cache'
    required: false
    default: ''
  python_version:
    description: 'Python version to install'
    required: false
    default: '3.10'
    deprecationMessage: 'This input is deprecated and will be removed in future versions. Use the Python version set in the GitHub runner instead or a GitHub Action to set up Python.'
  python:
    description: 'Python interpreter, a command on PATH or a path, to create the virtual environment with (use_venv) or else to install Conan with. Without use_venv, Conan has to end up on PATH, e.g. with the Python set up by actions/setup-python'
    required: false
    default: 'python'
  upgrade_pip:
    description: 'Upgrade pip to the latest version before installing Conan'
    required: false
    default: 'true'
  use_venv:
    description: 'Install Conan inside an isolated virtual environment'
    required: false
    default: 'false'
  profile_detect:
    description: 'Automatically detect and use a Conan profile based on the GitHub runner environment'
    required: false
    default: 'true'

outputs:
  conan-version:
    description: "Conan version"
    value: ${{ steps.install-conan.outputs.conan-version }}
  conan-home:
    description: "Conan cache directory"
    value: ${{ steps.get-conan-home.outputs.conan-home }}

runs:
  using: 'composite'
  steps:
    - name: Check Conan version
      shell: bash
      id: check-conan-version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          conan_version="${{ inputs.version }}"
          if [[ "$conan_version" == 1.* ]]; then
            echo "ERROR: Conan 1.x is not supported. Please use Conan 2.x"
            exit 1
          fi
        fi

    - name: Set CONAN_HOME
      if: ${{ inputs.home != '' }}
      id: export-conan-home
      shell: bash
      run: |
        echo "CONAN_HOME=${{ inputs.home }}" >> $GITHUB_ENV

    - name: Create virtual environment
      if: ${{ inputs.use_venv == 'true' }}
      shell: bash
      env:
        PYTHON: ${{ inputs.python }}
      run: |
        VENV_DIR="${RUNNER_TEMP}/conan-venv"
        "${PYTHON:-python}" -m venv "$VENV_DIR"
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          BIN_DIR="$VENV_DIR/Scripts"
        else
          BIN_DIR="$VENV_DIR/bin"
        fi
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "VENV_PIP=$BIN_DIR/pip" >> "$GITHUB_ENV"
        echo "VENV_CONAN=$BIN_DIR/conan" >> "$GITHUB_ENV"
        echo "VENV_PYTHON=$BIN_DIR/python" >> "$GITHUB_ENV"

    - name: 'Install Conan'
      shell: bash
      id: install-conan
      env:
        PYTHON: ${{ inputs.python }}
        USE_VENV: ${{ inputs.use_venv }}
        UPGRADE_PIP: ${{ inputs.upgrade_pip }}
        CONAN_VERSION: ${{ inputs.version }}
      run: |
        if [ "$USE_VENV" = 'true' ]; then
          PYTHON_CMD="$VENV_PYTHON"
        else
          PYTHON_CMD="${PYTHON:-python}"
        fi
        if [ "$UPGRADE_PIP" = 'true' ]; then
          "$PYTHON_CMD" -m pip install --upgrade pip
        fi
        if [ -n "$CONAN_VERSION" ]; then
          "$PYTHON_CMD" -m pip install "conan==$CONAN_VERSION"
        else
          "$PYTHON_CMD" -m pip install conan
        fi
        if ! command -v conan > /dev/null; then
          echo "ERROR: Conan was installed with $PYTHON_CMD, but conan is not on PATH. Use use_venv, or a Python whose scripts folder is on PATH"
          exit 1
        fi
        echo "conan-version=$(conan --version | cut -d' ' -f3)" >> $GITHUB_OUTPUT

    - name: Detect Conan profile
      if: ${{ inputs.profile_detect == 'true' }}
      shell: bash
      id: detect-conan-profile
      run: |
        conan profile detect || true

    - name: Get Conan cache folder path
      shell: bash
      id: get-conan-home
      run: echo "conan-home=$(conan config home)" >> $GITHUB_OUTPUT

    - name: 'Configure Conan'
      if: ${{ inputs.config_urls != '' }}
      id: configure-conan
      shell: bash
      run: |
        echo "${{ inputs.config_urls }}" | while read -r url; do
        if [ ! -z "$url" ]; then
          conan config install "$url"
        fi
        done

    - name: 'Authenticate Audit'
      if: ${{ inputs.audit_token != '' }}
      id: conan-audit-authentication
      shell: bash
      run: |
        conan audit provider auth conancenter --token=${{ inputs.audit_token }}

    - name: Compute Conan cache key
      if: ${{ inputs.cache_packages == 'true' }}
      id: conan-cache-key
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache_key }}
      run: |
        prefix="conan-${CACHE_KEY:+${CACHE_KEY}-}${{ runner.os }}-${{ runner.arch }}-${ImageOS:-selfhosted}-"
        echo "prefix=${prefix}" >> $GITHUB_OUTPUT
        echo "key=${prefix}${GITHUB_RUN_ID}-${{ job.check_run_id }}" >> $GITHUB_OUTPUT

    - name: Cache Conan packages
      if: ${{ inputs.cache_packages == 'true' }}
      # INFO: cache v6.1.0 commit - Keep this commit hash for security verification
      # See https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-conan-packages
      with:
        path: ${{ steps.get-conan-home.outputs.conan-home }}/p
        key: ${{ steps.conan-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.conan-cache-key.outputs.prefix }}

branding:
  icon: 'package'
  color: 'blue'
